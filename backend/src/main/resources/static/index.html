<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> RING </title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  <link rel="stylesheet" href="ring.css" />
</head>

<body>
  <div class="app">
    <header>
      <h1> RING </h1>
      <p> location-based reminders </p>
    </header>

    <main>
      <section class="map-section">
        <div id="map"> </div>
      </section>

      <section class="panel">
        <h2> create reminders </h2>
        <form id="reminder-form">

          <div class="form-group">
            <label for="title"> reminder title </label>
            <input type="text" id="title" placeholder="e. g. buy your meds" required>
          </div>

          <div class="coords">
            <div class="form-group">
            <label for="latitude"> latitude </label>
            <input type="number" id="latitude" step="any" readonly required>
            </div>

            <div class="form-group">
            <label for="longitude"> longitude </label>
            <input type="number" id="longitude" step="any" readonly required>
            </div>
          </div>

          <div class="form-group">
            <label for="radius"> radius(meters) </label>
            <input type="number" id="radius" placeholder="200m" min="10" value="100" required>
          </div>

          <button type="submit"> create reminder </button>
        </form>

        <div id="status"></div>
      </section>

      <section class="reminders-section">
        <h2> existing reminders </h2>
        <div id="reminders-list">
          <p class="empty"> loading reminders... </p>
        </div>
      </section>
    </main>
  </div>

   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script src="ring.js"> </script> 
</body>
</html>
