<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> create reminder </title>
  <link rel="stylesheet" href="ring.css" />
  <script src="ring.js"></script>
</head>

<body>

  <header class="topbar">
    <h1> RInG </h1>

    <nav>
      <a href="ring.html" class="active"> create </a>
      <a href="reminders.html"> my reminders </a>
    </nav>

  </header>

  <main class="container">
    <h2> new reminder </h2>

    <form id="reminder-form" class="card">
      <label for="name"> reminder name </label>
      <input type="text" id="name" placeholder="buy shampoo" required />

      <label> location </label>
      <div class="coords">
        <input type="number" step="any" id="lat" placeholder="latitude" required />
        <input type="number" step="any" id="lng" placeholder="longitude" required />
      </div>

      <label for="radius"> radius (meters)</label>
      <input type="number" id="radius" min="10" value="200" required />

      <button type="submit"> create reminder </button>
      <p id="status" class="status"></p>
    </form>
  </main>

</body>
</html>
